# PLM (Private Language Model) Configuration

project:
  name: "Private Language Model"
  version: "1.0.0"
  description: "Dual-API data generation system for training private AI models"

# Data Generation Pipeline
data_generation:
  # Topics for your niche - CUSTOMIZE THESE!
  topics:
    - "Python programming fundamentals"
    - "Web development best practices"
    - "Machine learning basics"
    - "Database design patterns"
    - "API development"
    - "Data structures and algorithms"
    - "Software architecture"
    - "DevOps practices"
    - "Cloud computing"
    - "Cybersecurity basics"

  # Questions to generate per topic
  questions_per_topic: 50

  # Batch processing
  batch_size: 10
  save_interval: 100

  # Quality control
  quality_threshold: 7  # 1-10 scale
  enable_validation: true

  # Retry settings
  max_retries: 3
  retry_delay: 5  # seconds

# API Configuration
api:
  # Which API to use for each task
  question_generator: "openai"  # "openai" or "claude"
  answer_generator: "claude"    # "openai" or "claude"
  quality_validator: "claude"   # "openai" or "claude"

  # Model settings
  claude:
    question_model: "claude-sonnet-4-5-20241022"
    answer_model: "claude-sonnet-4-5-20241022"
    validator_model: "claude-opus-4-5-20251101"
    max_tokens: 4000
    temperature: 0.7

  openai:
    question_model: "gpt-4"
    answer_model: "gpt-4"
    validator_model: "gpt-4"
    max_tokens: 4000
    temperature: 0.7

# Training Configuration
training:
  # Base model to fine-tune
  base_model: "meta-llama/Llama-3.2-3B-Instruct"

  # Training parameters
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_steps: 100
  max_seq_length: 2048

  # Output
  output_dir: "./models/my-private-model-v1"
  save_steps: 100
  logging_steps: 10

# Ollama Deployment
ollama:
  model_name: "my-private-ai"
  temperature: 0.7
  context_window: 4096
  system_prompt: |
    You are a highly specialized AI assistant trained on specific domain knowledge.
    Provide accurate, detailed, and helpful responses.

# Paths
paths:
  data_dir: "./data"
  raw_data_dir: "./data/raw"
  processed_data_dir: "./data/processed"
  models_dir: "./models"
  logs_dir: "./logs"
  notebooks_dir: "./notebooks"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/plm.log"
  console: true

# Monitoring
monitoring:
  enable_dashboard: true
  save_stats: true
  stats_file: "./logs/stats.json"
