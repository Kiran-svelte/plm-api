<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLM SaaS - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        h1 { margin-bottom: 30px; color: #60a5fa; font-size: 32px; }
        h2 { margin: 30px 0 15px; color: #93c5fd; font-size: 24px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat-value { font-size: 42px; font-weight: bold; color: #60a5fa; }
        .stat-label { color: #94a3b8; margin-top: 8px; font-size: 14px; }

        .onboard-form {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 40px;
            border: 1px solid #334155;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
        }

        textarea { min-height: 100px; font-family: inherit; }

        button {
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }

        .startups-grid {
            display: grid;
            gap: 20px;
        }

        .startup-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: start;
        }

        .startup-info h3 { color: #60a5fa; margin-bottom: 10px; }
        .startup-niche { color: #94a3b8; margin-bottom: 15px; }
        .startup-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .topic-tag {
            background: #334155;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #cbd5e1;
        }

        .startup-status {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .status-item { color: #94a3b8; }
        .status-value { color: #60a5fa; font-weight: 500; }

        .startup-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            white-space: nowrap;
        }

        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }

        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message-success { background: #10b981; color: white; }
        .message-error { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 PLM SaaS Platform - Admin Dashboard</h1>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-value">--</div>
                <div class="stat-label">Total Startups</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">--</div>
                <div class="stat-label">Active Startups</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">--</div>
                <div class="stat-label">Data Generated</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">--</div>
                <div class="stat-label">Models Ready</div>
            </div>
        </div>

        <div id="message"></div>

        <h2>Onboard New Startup</h2>
        <div class="onboard-form">
            <form id="onboardForm">
                <div class="form-group">
                    <label for="name">Startup Name</label>
                    <input type="text" id="name" required placeholder="e.g., HealthTech AI">
                </div>

                <div class="form-group">
                    <label for="niche">Niche/Industry</label>
                    <input type="text" id="niche" required placeholder="e.g., Healthcare Technology">
                </div>

                <div class="form-group">
                    <label for="topics">Topics (comma-separated)</label>
                    <textarea id="topics" required placeholder="e.g., Medical AI, Patient care, Healthcare data, Telemedicine"></textarea>
                </div>

                <button type="submit">Onboard Startup</button>
            </form>
        </div>

        <h2>Startups</h2>
        <div class="startups-grid" id="startups">
            <div class="loading">Loading startups...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/stats`);
                const stats = await res.json();

                const statsDiv = document.getElementById('stats');
                statsDiv.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_startups}</div>
                        <div class="stat-label">Total Startups</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.active_startups}</div>
                        <div class="stat-label">Active Startups</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_data_generated.toLocaleString()}</div>
                        <div class="stat-label">Data Generated</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.models_ready}</div>
                        <div class="stat-label">Models Ready</div>
                    </div>
                `;
            } catch (err) {
                console.error('Error loading stats:', err);
            }
        }

        async function loadStartups() {
            try {
                const res = await fetch(`${API_URL}/startups`);
                const startups = await res.json();

                const startupsDiv = document.getElementById('startups');

                if (startups.length === 0) {
                    startupsDiv.innerHTML = '<div class="loading">No startups yet. Onboard your first one above!</div>';
                    return;
                }

                startupsDiv.innerHTML = startups.map(startup => `
                    <div class="startup-card">
                        <div class="startup-info">
                            <h3>${startup.name}</h3>
                            <div class="startup-niche">🎯 ${startup.niche}</div>
                            <div class="startup-topics">
                                ${startup.topics.map(t => `<span class="topic-tag">${t}</span>`).join('')}
                            </div>
                            <div class="startup-status">
                                <div class="status-item">
                                    Status: <span class="status-value">${startup.status}</span>
                                </div>
                                <div class="status-item">
                                    Model: <span class="status-value">${startup.model_status}</span>
                                </div>
                                <div class="status-item">
                                    Data: <span class="status-value">${startup.data_generated || 0}</span>
                                </div>
                            </div>
                        </div>
                        <div class="startup-actions">
                            <button class="btn-small btn-success" onclick="generateData('${startup.startup_id}')">
                                Generate Data
                            </button>
                            <button class="btn-small" onclick="viewDetails('${startup.startup_id}')">
                                View Details
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading startups:', err);
                document.getElementById('startups').innerHTML = '<div class="loading">Error loading startups</div>';
            }
        }

        async function generateData(startupId) {
            if (!confirm('Generate 1000 training examples? This will take ~2-3 hours.')) return;

            try {
                showMessage('Starting data generation...', 'success');

                const res = await fetch(`${API_URL}/startups/${startupId}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ num_examples: 1000 })
                });

                const result = await res.json();
                showMessage(`Generation started! ${result.message}`, 'success');

                setTimeout(() => {
                    loadStats();
                    loadStartups();
                }, 2000);
            } catch (err) {
                showMessage(`Error: ${err.message}`, 'error');
            }
        }

        function viewDetails(startupId) {
            window.open(`/startup/${startupId}`, '_blank');
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message message-${type}">${text}</div>`;
            setTimeout(() => messageDiv.innerHTML = '', 5000);
        }

        document.getElementById('onboardForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const niche = document.getElementById('niche').value;
            const topics = document.getElementById('topics').value.split(',').map(t => t.trim());

            try {
                const res = await fetch(`${API_URL}/startups`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, niche, topics })
                });

                const result = await res.json();
                showMessage(`✓ ${result.message}`, 'success');

                e.target.reset();
                loadStats();
                loadStartups();
            } catch (err) {
                showMessage(`Error: ${err.message}`, 'error');
            }
        });

        // Load data on page load
        loadStats();
        loadStartups();

        // Refresh every 30 seconds
        setInterval(() => {
            loadStats();
            loadStartups();
        }, 30000);
    </script>
</body>
</html>
